name: R4 input and audio lifecycle

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/Runtime/SdlAudioBridge.*'
      - 'Source/NeoEngine/Runtime/SdlInputBridge.*'
      - 'Source/NeoEngine/Runtime/InputState.*'
      - 'Source/NeoEngine/Runtime/UiInputRouter.*'
      - 'Source/NeoEngine/Runtime/AudioMixer.*'
      - 'Source/NeoEngine/Runtime/WavAudioParser.*'
      - 'Source/NeoEngine/Runtime/AudioComponent.*'
      - 'Source/NeoEngine/Runtime/EditorScene*.*'
      - 'Tests/Runtime/sdl_audio_bridge_smoke.cpp'
      - 'Tests/Runtime/sdl_input_bridge_smoke.cpp'
      - 'Tests/Runtime/input_state_smoke.cpp'
      - 'Tests/Runtime/ui_input_router_smoke.cpp'
      - 'Tests/Runtime/audio_subsystem_smoke.cpp'
      - 'Tests/Runtime/editor_subsystem_smoke.cpp'
      - '.github/workflows/r4-input-audio.yml'
  pull_request:
    paths:
      - 'Source/NeoEngine/Runtime/SdlAudioBridge.*'
      - 'Source/NeoEngine/Runtime/SdlInputBridge.*'
      - 'Source/NeoEngine/Runtime/InputState.*'
      - 'Source/NeoEngine/Runtime/UiInputRouter.*'
      - 'Source/NeoEngine/Runtime/AudioMixer.*'
      - 'Source/NeoEngine/Runtime/WavAudioParser.*'
      - 'Source/NeoEngine/Runtime/AudioComponent.*'
      - 'Source/NeoEngine/Runtime/EditorScene*.*'
      - 'Tests/Runtime/sdl_audio_bridge_smoke.cpp'
      - 'Tests/Runtime/sdl_input_bridge_smoke.cpp'
      - 'Tests/Runtime/input_state_smoke.cpp'
      - 'Tests/Runtime/ui_input_router_smoke.cpp'
      - 'Tests/Runtime/audio_subsystem_smoke.cpp'
      - 'Tests/Runtime/editor_subsystem_smoke.cpp'
      - '.github/workflows/r4-input-audio.yml'
  workflow_dispatch:

jobs:
  input-audio:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libglm-dev libjsoncpp-dev libvulkan-dev glslang-tools ninja-build pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libxss-dev libxtst-dev libwayland-dev libdecor-0-dev wayland-protocols
      - name: Build and install SDL3
        run: |
          curl -L --fail --retry 3 -o /tmp/SDL3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.14 -B /tmp/sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF
          cmake --build /tmp/sdl3-build --parallel 2
          sudo cmake --install /tmp/sdl3-build
      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r4-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local
      - name: Build and run Release smokes
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          cmake --build build/r4-release --target sdl_audio_bridge_smoke sdl_input_bridge_smoke input_state_smoke ui_input_router_smoke audio_subsystem_smoke editor_subsystem_smoke -j2
          ./build/r4-release/sdl_audio_bridge_smoke
          ./build/r4-release/sdl_input_bridge_smoke
          ./build/r4-release/input_state_smoke
          ./build/r4-release/ui_input_router_smoke
          ./build/r4-release/audio_subsystem_smoke
          ./build/r4-release/editor_subsystem_smoke
      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r4-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=/usr/local '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build and run ASAN smokes
        env:
          ASAN_OPTIONS: detect_leaks=1
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          cmake --build build/r4-asan --target sdl_audio_bridge_smoke sdl_input_bridge_smoke input_state_smoke ui_input_router_smoke audio_subsystem_smoke editor_subsystem_smoke -j2
          ./build/r4-asan/sdl_audio_bridge_smoke
          ./build/r4-asan/sdl_input_bridge_smoke
          ./build/r4-asan/input_state_smoke
          ./build/r4-asan/ui_input_router_smoke
          ./build/r4-asan/audio_subsystem_smoke
          ./build/r4-asan/editor_subsystem_smoke
