name: P1-P3 sandbox validation

on:
  push:
    branches:
      - p1-renderer-asset-animation-night
  pull_request:
    branches:
      - sandbox-p0-validation-20260920
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/**'
      - 'FauzanEngine/backend/**'
      - 'Source/NeoEngine/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: x11
  SDL_AUDIODRIVER: dummy

jobs:
  release-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev
      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.16
          install-linux-dependencies: true
      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/p1-p3-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release smoke targets
        run: |
          cmake --build build/p1-p3-release --target all -j2
          cmake --build build/p1-p3-release --target vulkan_renderer_3d_smoke -j2
      - name: Run Release smoke targets
        run: |
          xvfb-run -a bash -lc 'for t in canonical_runtime_world_smoke neo_runtime_ecs_integration_smoke runtime_frame_contract_smoke asset_streaming_queue_smoke gameplay_physics_query_smoke gltf_mesh_builder_smoke gltf_gpu_uploader_smoke asset_resource_manager_smoke farm_vulkan_textured_present_smoke animation_graph_smoke skeletal_animation_controller_smoke gpu_skinning_palette_buffer_smoke skinning_gpu_smoke vulkan_bootstrap_smoke vulkan_descriptor_manager_smoke vulkan_gpu_buffer_smoke vulkan_gpu_texture_smoke vulkan_graphics_pipeline_smoke vulkan_mesh_buffer_builder_smoke vulkan_offscreen_smoke vulkan_render_command_recorder_smoke vulkan_render_pass_manager_smoke vulkan_renderer_3d_smoke vulkan_shader_smoke vulkan_swapchain_manager_smoke vulkan_sync_primitives_smoke vulkan_textured_present_smoke vulkan_rhi_smoke renderer_capability_smoke scene_vulkan_render_adapter_smoke r3_gpu_indirect_10k_execution_smoke r3_gpu_indirect_capacity_smoke gpu_driven_renderer_smoke vulkan_mesh_indirect_batch_smoke vulkan_mesh_indirect_batch_gpu_smoke pbr_material_smoke pbr_lighting_smoke pbr_ibl_smoke pbr_render_pipeline_smoke pbr_environment_smoke pbr_environment_descriptor_smoke shader_library_smoke sdl_audio_bridge_smoke audio_mixer_smoke sdl_input_bridge_smoke input_state_smoke ui_input_router_smoke audio_subsystem_smoke editor_subsystem_smoke farm_canonical_game_tool_smoke neo_runtime_farm_vertical_slice_smoke farm_authoritative_session_loopback_smoke authority_loopback_transport_smoke farm_commerce_entitlement_smoke farm_commerce_checkpoint_smoke farm_authoritative_service_smoke r6_anti_cheat_100_smoke r7_economy_commerce_100_smoke r8_persistence_recovery_100_smoke r9_live_ops_telemetry_100_smoke r10_security_privacy_100_smoke comprehensive_engine_verification_smoke farm_telemetry_smoke; do echo "RUN $t"; ./build/p1-p3-release/$t; done'
      - name: Configure ASAN
        run: cmake -S Source/NeoEngine -B build/p1-p3-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build ASAN smoke targets
        run: cmake --build build/p1-p3-asan --target all -j2
      - name: Build Vulkan renderer smoke target under ASAN
        run: cmake --build build/p1-p3-asan --target vulkan_renderer_3d_smoke -j2
      - name: Run ASAN smoke targets
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          xvfb-run -a bash -lc 'for t in canonical_runtime_world_smoke neo_runtime_ecs_integration_smoke runtime_frame_contract_smoke asset_streaming_queue_smoke gameplay_physics_query_smoke gltf_mesh_builder_smoke gltf_gpu_uploader_smoke asset_resource_manager_smoke farm_vulkan_textured_present_smoke animation_graph_smoke skeletal_animation_controller_smoke gpu_skinning_palette_buffer_smoke skinning_gpu_smoke vulkan_bootstrap_smoke vulkan_descriptor_manager_smoke vulkan_gpu_buffer_smoke vulkan_gpu_texture_smoke vulkan_graphics_pipeline_smoke vulkan_mesh_buffer_builder_smoke vulkan_offscreen_smoke vulkan_render_command_recorder_smoke vulkan_render_pass_manager_smoke vulkan_renderer_3d_smoke vulkan_shader_smoke vulkan_swapchain_manager_smoke vulkan_sync_primitives_smoke vulkan_textured_present_smoke vulkan_rhi_smoke renderer_capability_smoke scene_vulkan_render_adapter_smoke r3_gpu_indirect_10k_execution_smoke r3_gpu_indirect_capacity_smoke gpu_driven_renderer_smoke vulkan_mesh_indirect_batch_smoke vulkan_mesh_indirect_batch_gpu_smoke pbr_material_smoke pbr_lighting_smoke pbr_ibl_smoke pbr_render_pipeline_smoke pbr_environment_smoke pbr_environment_descriptor_smoke shader_library_smoke sdl_audio_bridge_smoke audio_mixer_smoke sdl_input_bridge_smoke input_state_smoke ui_input_router_smoke audio_subsystem_smoke editor_subsystem_smoke farm_canonical_game_tool_smoke neo_runtime_farm_vertical_slice_smoke farm_authoritative_session_loopback_smoke authority_loopback_transport_smoke farm_commerce_entitlement_smoke farm_commerce_checkpoint_smoke farm_authoritative_service_smoke r6_anti_cheat_100_smoke r7_economy_commerce_100_smoke r8_persistence_recovery_100_smoke r9_live_ops_telemetry_100_smoke r10_security_privacy_100_smoke comprehensive_engine_verification_smoke farm_telemetry_smoke; do echo "RUN $t"; ./build/p1-p3-asan/$t; done'
