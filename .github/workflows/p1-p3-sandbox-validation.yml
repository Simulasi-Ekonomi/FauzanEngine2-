name: P1-P3 sandbox validation

on:
  push:
    branches:
      - p1-renderer-asset-animation-night
  pull_request:
    branches:
      - sandbox-p0-validation-20260920
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/**'
      - 'FauzanEngine/backend/**'
      - 'Source/NeoEngine/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: x11
  SDL_AUDIODRIVER: dummy

jobs:
  release-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev
      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.16
          install-linux-dependencies: true
      - name: Verify SDL3-only source and compatibility shims
        run: |
          if grep -RInE '#include <SDL\\.h>|#include <SDL_vulkan\\.h>|SDL2::|find_package\\(SDL2|SDL_WINDOWPOS_|SDL_WINDOWEVENT|SDL_CONTROLLER|SDL_RenderCopy\\(|SDL_RENDERER_SOFTWARE|AUDIO_S16SYS' Source Tests --include='*.cpp' --include='*.h'; then
            echo 'Stale SDL2 API detected.'
            exit 1
          fi
          test ! -e Source/NeoEngine/SDL.h
          test ! -e Source/NeoEngine/SDL_vulkan.h

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/p1-p3-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Release smoke targets
        run: |
          cmake --build build/p1-p3-release --target all -j2
          test "$(grep -c '_smoke        run: cmake -S Source/NeoEngine -B build/p1-p3-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build ASAN smoke targets
        run: cmake --build build/p1-p3-asan --target all -j2
      - name: Run ASAN 74/74 smoke targets
        env:
          ASAN_OPTIONS: detect_leaks=1
          SDL_VIDEODRIVER: x11
        run: |
          pass=0
          fail=0
          while IFS= read -r t; do
            echo "RUN $t"
            if xvfb-run -a "./build/p1-p3-asan/$t"; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi
          done < /tmp/p1_targets.txt
          test "$pass" -eq 74
          test "$fail" -eq 0
          echo "P1 ASAN: pass=$pass fail=$fail total=74"
