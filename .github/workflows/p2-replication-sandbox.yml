name: P2 replication sandbox validation

on:
  push:
    branches:
      - p2-physics-networking-night
  pull_request:
    branches:
      - sandbox-p0-validation-20260920
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/replication_world_smoke.cpp'
      - 'Source/NeoEngine/CMakeLists.txt'

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  replication-release-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools pkg-config
      - name: Install SDL3
        uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3
        with:
          version: 3.4.16
          install-linux-dependencies: true
      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/p2-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build replication smoke
        run: cmake --build build/p2-release --target replication_world_smoke -j2
      - name: Run replication smoke
        run: ./build/p2-release/replication_world_smoke
      - name: Configure ASAN
        run: cmake -S Source/NeoEngine -B build/p2-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build replication smoke ASAN
        run: cmake --build build/p2-asan --target replication_world_smoke -j2
      - name: Run replication smoke ASAN
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/p2-asan/replication_world_smoke
      - name: Configure UBSAN
        run: cmake -S Source/NeoEngine -B build/p2-ubsan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined'
      - name: Build replication smoke UBSAN
        run: cmake --build build/p2-ubsan --target replication_world_smoke -j2
      - name: Run replication smoke UBSAN
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/p2-ubsan/replication_world_smoke
