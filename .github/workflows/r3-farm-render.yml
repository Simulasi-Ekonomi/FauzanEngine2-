name: R3 Farm renderer path

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/farm_vulkan_textured_present_smoke.cpp'
      - '.github/workflows/r3-farm-render.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/farm_vulkan_textured_present_smoke.cpp'
      - '.github/workflows/r3-farm-render.yml'
  workflow_dispatch:

jobs:
  farm-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev  glslang-tools ninja-build xvfb mesa-vulkan-drivers libx11-xcb1 libxcb1 libxrandr2 libxinerama1 libxcursor1 libxi6 libvulkan1 vulkan-tools

      - name: Install SDL 3.4.14
        run: |
          curl -L --fail --retry 3 -o /tmp/SDL3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.14 -B /tmp/sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_VIDEO_OFFSCREEN=ON
          cmake --build /tmp/sdl3-build --parallel 2
          sudo cmake --install /tmp/sdl3-build


      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r3-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Release smoke under Xvfb
        run: |
          cmake --build build/r3-release --target farm_vulkan_textured_present_smoke -j2
          ls -R /usr/share/vulkan/icd.d/ || true
          xvfb-run -a -s '-screen 0 1024x768x24' env SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json ./build/r3-release/farm_vulkan_textured_present_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r3-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build and run ASAN smoke under Xvfb
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          cmake --build build/r3-asan --target farm_vulkan_textured_present_smoke -j2
          xvfb-run -a -s '-screen 0 1024x768x24' env SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json ./build/r3-asan/farm_vulkan_textured_present_smoke
