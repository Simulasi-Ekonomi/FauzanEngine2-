name: R3 Farm renderer path

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/farm_vulkan_textured_present_smoke.cpp'
      - '.github/workflows/r3-farm-render.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/farm_vulkan_textured_present_smoke.cpp'
      - '.github/workflows/r3-farm-render.yml'
  workflow_dispatch:

jobs:
  farm-render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools ninja-build xvfb mesa-vulkan-drivers libx11-xcb1 libxcb1 libxrandr2 libxinerama1 libxcursor1 libxi6 libvulkan1 vulkan-tools libasound2-dev libpulse-dev libwayland-dev libx11-dev libxext-dev libxfixes-dev libxss-dev libxtst-dev libdrm-dev libgbm-dev libudev-dev
          VULKAN_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print | grep -E '/(lvp|lavapipe|swrast).*\.json$' | head -n 1)"
          test -n "${VULKAN_ICD}"
          echo "VULKAN_ICD=${VULKAN_ICD}" >> "${GITHUB_ENV}"
          echo "Using software Vulkan ICD: ${VULKAN_ICD}"

      - name: Build and install SDL3
        run: |
          set -euo pipefail
          SDL_VERSION=3.4.14
          SDL_SHA256=30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL3.tar.gz
          echo "${SDL_SHA256}  /tmp/SDL3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          SDL_SOURCE_DIR="$(tar -tzf /tmp/SDL3.tar.gz | awk -F/ 'NF > 1 {print $1; exit}')"
          test -n "${SDL_SOURCE_DIR}"
          test -f "/tmp/${SDL_SOURCE_DIR}/CMakeLists.txt"
          cmake -S "/tmp/${SDL_SOURCE_DIR}" -B /tmp/SDL-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL-build --parallel
          sudo cmake --install /tmp/SDL-build
          sudo ldconfig
          pkg-config --modversion sdl3

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r3-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Release smoke under Xvfb
        run: |
          cmake --build build/r3-release --target farm_vulkan_textured_present_smoke -j2
          xvfb-run -a -s '-screen 0 1024x768x24' env SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy VK_ICD_FILENAMES=${VULKAN_ICD} ./build/r3-release/farm_vulkan_textured_present_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r3-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build and run ASAN smoke under Xvfb
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          cmake --build build/r3-asan --target farm_vulkan_textured_present_smoke -j2
          xvfb-run -a -s '-screen 0 1024x768x24' env SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy VK_ICD_FILENAMES=${VULKAN_ICD} ./build/r3-asan/farm_vulkan_textured_present_smoke
