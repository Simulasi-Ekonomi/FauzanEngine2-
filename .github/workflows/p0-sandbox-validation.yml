name: P0 sandbox validation

on:
  pull_request:
    branches:
      - main
      - sandbox-p0-validation-20260920
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - 'Source/NeoEngine/CMakeLists.txt'
      - '.github/workflows/p0-sandbox-validation.yml'
  workflow_dispatch:

jobs:
  p0-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build             libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev             glslang-tools pkg-config xvfb             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev             libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.14
          install-linux-dependencies: true

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/p0-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build P0 Release targets
        run: |
          cmake --build build/p0-release --target             farm_canonical_game_tool_smoke             neo_runtime_farm_vertical_slice_smoke             farm_authoritative_session_loopback_smoke             authority_loopback_transport_smoke             -j2

      - name: Run P0 Release smokes
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/p0-release/farm_canonical_game_tool_smoke
          ./build/p0-release/neo_runtime_farm_vertical_slice_smoke
          ./build/p0-release/farm_authoritative_session_loopback_smoke
          ./build/p0-release/authority_loopback_transport_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/p0-asan -G Ninja             -DCMAKE_BUILD_TYPE=Debug             '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer'             '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build P0 ASAN targets
        run: |
          cmake --build build/p0-asan --target             farm_canonical_game_tool_smoke             neo_runtime_farm_vertical_slice_smoke             farm_authoritative_session_loopback_smoke             authority_loopback_transport_smoke             -j2

      - name: Run P0 ASAN smokes
        env:
          ASAN_OPTIONS: detect_leaks=1
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/p0-asan/farm_canonical_game_tool_smoke
          ./build/p0-asan/neo_runtime_farm_vertical_slice_smoke
          ./build/p0-asan/farm_authoritative_session_loopback_smoke
          ./build/p0-asan/authority_loopback_transport_smoke
