name: PR44 editor mutation sandbox validation

on:
  push:
    branches:
      - p3-pr44-advanced-port
  pull_request:
    branches:
      - p3-editor-android-production-night
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/editor_scene_agent_smoke.cpp'
      - 'Tests/Runtime/editor_scene_session_smoke.cpp'
      - 'Source/NeoEngine/CMakeLists.txt'

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  editor-release-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools pkg-config
      - name: Install SDL3
        uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3
        with:
          version: 3.4.16
          install-linux-dependencies: true
      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/pr44-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build PR44 functional smoke targets
        run: |
          cmake --build build/pr44-release --target             editor_scene_agent_smoke             editor_scene_session_smoke             audio_subsystem_smoke             neo_runtime_audio_smoke             wav_audio_pitch_regression_smoke             pbr_lighting_smoke             vulkan_renderer_3d_smoke             -j2
      - name: Run PR44 functional smoke targets
        run: |
          set +e
          status=0
          for test in \
            editor_scene_agent_smoke \
            editor_scene_session_smoke \
            audio_subsystem_smoke \
            neo_runtime_audio_smoke \
            wav_audio_pitch_regression_smoke \
            pbr_lighting_smoke \
            vulkan_renderer_3d_smoke; do
            echo "=== PR44 RELEASE: $test ==="
            "./build/pr44-release/$test"
            rc=$?
            echo "=== PR44 RELEASE: $test exit=$rc ==="
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Configure ASAN
        run: cmake -S Source/NeoEngine -B build/pr44-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build PR44 functional smoke targets ASAN
        run: |
          cmake --build build/pr44-asan --target             editor_scene_agent_smoke             editor_scene_session_smoke             audio_subsystem_smoke             neo_runtime_audio_smoke             wav_audio_pitch_regression_smoke             pbr_lighting_smoke             vulkan_renderer_3d_smoke             -j2
      - name: Run PR44 functional smoke targets ASAN
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          set +e
          status=0
          for test in \
            editor_scene_agent_smoke \
            editor_scene_session_smoke \
            audio_subsystem_smoke \
            neo_runtime_audio_smoke \
            wav_audio_pitch_regression_smoke \
            pbr_lighting_smoke \
            vulkan_renderer_3d_smoke; do
            echo "=== PR44 ASAN: $test ==="
            "./build/pr44-asan/$test"
            rc=$?
            echo "=== PR44 ASAN: $test exit=$rc ==="
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          exit "$status"
