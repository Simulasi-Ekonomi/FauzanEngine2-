name: P1 Release + ASAN validation

on:
  workflow_dispatch:
  push:
    branches:
      - sandbox-p1-unreal-parity-validation

permissions:
  contents: read

jobs:
  release-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-tools libjsoncpp-dev libglm-dev libcurl4-openssl-dev rapidjson-dev glslang-tools pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.14
          install-linux-dependencies: true

      - name: Run complete P1 Release coverage
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          P1_BUILD_TYPE: Release
          P1_BUILD_JOBS: 2
        run: |
          chmod +x tools/p1_unreal_parity_sandbox.sh
          xvfb-run -a -s "-screen 0 1280x720x24" tools/p1_unreal_parity_sandbox.sh Build/p1-release Source/NeoEngine

      - name: Run complete P1 ASAN coverage
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=.github/asan/lsan-sdl3-x11.supp
          P1_BUILD_TYPE: Debug
          P1_CMAKE_CXX_FLAGS: -fsanitize=address -fno-omit-frame-pointer
          P1_CMAKE_EXE_LINKER_FLAGS: -fsanitize=address
          P1_BUILD_JOBS: 2
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" tools/p1_unreal_parity_sandbox.sh Build/p1-asan Source/NeoEngine

      - name: Report Release and ASAN coverage
        if: always()
        run: |
          echo "=== RELEASE SUMMARY ==="
          cat Build/p1-release/sandbox-report/summary.txt 2>/dev/null || true
          echo "=== ASAN SUMMARY ==="
          cat Build/p1-asan/sandbox-report/summary.txt 2>/dev/null || true
          echo "=== RELEASE MARKERS ==="
          cat Build/p1-release/sandbox-report/static_markers.txt 2>/dev/null || true
          echo "=== ASAN MARKERS ==="
          cat Build/p1-asan/sandbox-report/static_markers.txt 2>/dev/null || true

      - name: Upload Release and ASAN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-release-asan-complete-coverage
          path: |
            Build/p1-release/sandbox-report/
            Build/p1-asan/sandbox-report/
          if-no-files-found: warn
