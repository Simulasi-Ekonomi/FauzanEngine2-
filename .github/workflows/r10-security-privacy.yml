name: R10 security and privacy boundaries

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/Runtime/RuntimePersistence.*'
      - 'Source/NeoEngine/Runtime/AtomicSaveFile.*'
      - 'Source/NeoEngine/Systems/FarmTelemetryAdapter.*'
      - 'Source/NeoEngine/Systems/AuthoritativeCommandGate.*'
      - 'Source/NeoEngine/Systems/TrustSafetySystem.*'
      - 'Tests/Runtime/runtime_persistence_smoke.cpp'
      - 'Tests/Runtime/atomic_save_file_smoke.cpp'
      - 'Tests/Farm/farm_telemetry_smoke.cpp'
      - 'Tests/Systems/authoritative_command_gate_smoke.cpp'
      - 'Tests/Systems/trust_safety_smoke.cpp'
      - '.github/workflows/r10-security-privacy.yml'
  pull_request:
    paths:
      - 'Source/NeoEngine/Runtime/RuntimePersistence.*'
      - 'Source/NeoEngine/Runtime/AtomicSaveFile.*'
      - 'Source/NeoEngine/Systems/FarmTelemetryAdapter.*'
      - 'Source/NeoEngine/Systems/AuthoritativeCommandGate.*'
      - 'Source/NeoEngine/Systems/TrustSafetySystem.*'
      - 'Tests/Runtime/runtime_persistence_smoke.cpp'
      - 'Tests/Runtime/atomic_save_file_smoke.cpp'
      - 'Tests/Farm/farm_telemetry_smoke.cpp'
      - 'Tests/Systems/authoritative_command_gate_smoke.cpp'
      - 'Tests/Systems/trust_safety_smoke.cpp'
      - '.github/workflows/r10-security-privacy.yml'
  workflow_dispatch:

jobs:
  security-privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-tools ninja-build libjsoncpp-dev

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r10-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Release boundary smokes
        run: |
          cmake --build build/r10-release --target r10_security_privacy_100_smoke -j2
          ./build/r10-release/r10_security_privacy_100_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r10-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build and run ASAN boundary smokes
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cmake --build build/r10-asan --target r10_security_privacy_100_smoke -j2
          ./build/r10-asan/r10_security_privacy_100_smoke
