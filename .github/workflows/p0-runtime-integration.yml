name: P0 canonical runtime integration

on:
  push:
    branches:
      - main
      - p3-pr44-advanced-port
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/p0_runtime_physics_integration_smoke.cpp'
      - '.github/workflows/p0-runtime-integration.yml'
  pull_request:
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Runtime/p0_runtime_physics_integration_smoke.cpp'
      - '.github/workflows/p0-runtime-integration.yml'
  workflow_dispatch:

jobs:
  p0-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools ninja-build

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/p0-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Release smoke
        run: |
          cmake --build build/p0-release --target p0_runtime_physics_integration_smoke -j2
          ./build/p0-release/p0_runtime_physics_integration_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/p0-asan -G Ninja             -DCMAKE_BUILD_TYPE=Debug             '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer'             '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build and run ASAN smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: |
          cmake --build build/p0-asan --target p0_runtime_physics_integration_smoke -j2
          ./build/p0-asan/p0_runtime_physics_integration_smoke
