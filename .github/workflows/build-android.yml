name: Build Android APK

on:
  push:
    branches: [ main, master, p3-pr44-advanced-port ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install Android build packages
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: editor/package-lock.json

    - name: Build Editor (React)
      run: |
        cd editor
        npm ci
        npm run build
        mkdir -p ../android/app/src/main/assets/editor
        cp -r dist/* ../android/app/src/main/assets/editor/

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.4'

    - name: Build Debug APK and AAB
      run: |
        cd android
        gradle assembleDebug bundleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: NeoEngine-Debug-APK
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/bundle/debug/app-debug.aab
        retention-days: 30

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install Android build packages
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: editor/package-lock.json

    - name: Build Editor
      run: |
        cd editor
        npm ci
        npm run build
        mkdir -p ../android/app/src/main/assets/editor
        cp -r dist/* ../android/app/src/main/assets/editor/

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.4'

    - name: Build Release APK
      run: |
        cd android
        gradle assembleRelease --no-daemon

    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: NeoEngine-Release-APK
        path: android/app/build/outputs/apk/release/app-release*.apk
        retention-days: 90
