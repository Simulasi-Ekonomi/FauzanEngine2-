name: P2 physics networking validation

on:
  push:
    branches:
      - p2-physics-networking-night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev libjsoncpp-dev libglm-dev libcurl4-openssl-dev glslang-tools pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev
      - name: Install SDL3
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.14
          install-linux-dependencies: true
      - name: Release configure and build
        run: |
          cmake -S Source/NeoEngine -B build/p2-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/p2-release --target canonical_runtime_world_smoke physics_step_measurement_smoke farm_authoritative_session_loopback_smoke authority_loopback_transport_smoke -j2
      - name: Release smoke
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/p2-release/canonical_runtime_world_smoke
          ./build/p2-release/physics_step_measurement_smoke
          ./build/p2-release/farm_authoritative_session_loopback_smoke
          ./build/p2-release/authority_loopback_transport_smoke
      - name: ASAN configure and build
        run: |
          cmake -S Source/NeoEngine -B build/p2-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
          cmake --build build/p2-asan --target canonical_runtime_world_smoke physics_step_measurement_smoke farm_authoritative_session_loopback_smoke authority_loopback_transport_smoke -j2
      - name: ASAN smoke
        env:
          ASAN_OPTIONS: detect_leaks=1
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/p2-asan/canonical_runtime_world_smoke
          ./build/p2-asan/physics_step_measurement_smoke
          ./build/p2-asan/farm_authoritative_session_loopback_smoke
          ./build/p2-asan/authority_loopback_transport_smoke
