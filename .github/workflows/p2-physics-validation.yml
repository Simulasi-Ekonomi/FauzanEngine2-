name: P2 physics networking complete validation

on:
  push:
    branches:
      - p2-physics-networking-night
  pull_request:
    branches:
      - main
      - sandbox-p0-validation-20260920
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/**'
      - 'tools/p2_physics_networking_sandbox.sh'
      - '.github/workflows/p2-physics-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-tools libjsoncpp-dev libglm-dev libcurl4-openssl-dev rapidjson-dev glslang-tools pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Run complete P2 Release coverage
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          P2_BUILD_TYPE: Release
          P2_BUILD_JOBS: 2
        run: |
          chmod +x tools/p2_physics_networking_sandbox.sh
          xvfb-run -a -s "-screen 0 1280x720x24" tools/p2_physics_networking_sandbox.sh Build/p2-release

      - name: Run complete P2 ASAN coverage
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=.github/asan/lsan-sdl3-x11.supp
          P2_BUILD_TYPE: Debug
          P2_CMAKE_CXX_FLAGS: -fsanitize=address -fno-omit-frame-pointer
          P2_CMAKE_EXE_LINKER_FLAGS: -fsanitize=address
          P2_BUILD_JOBS: 2
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" tools/p2_physics_networking_sandbox.sh Build/p2-asan

      - name: Report P2 coverage
        if: always()
        run: |
          echo "=== RELEASE ==="
          cat Build/p2-release/sandbox-report/summary.txt 2>/dev/null || true
          echo "=== ASAN ==="
          cat Build/p2-asan/sandbox-report/summary.txt 2>/dev/null || true
          echo "=== RELEASE MARKERS ==="
          cat Build/p2-release/sandbox-report/static_markers.txt 2>/dev/null || true
          echo "=== ASAN MARKERS ==="
          cat Build/p2-asan/sandbox-report/static_markers.txt 2>/dev/null || true

      - name: Upload P2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-complete-coverage
          path: |
            Build/p2-release/sandbox-report/
            Build/p2-asan/sandbox-report/
          if-no-files-found: warn
