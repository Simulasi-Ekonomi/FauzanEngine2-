name: Backend telemetry forwarder validation

on:
  push:
    branches:
      - p3-editor-android-production-night
  workflow_dispatch:

jobs:
  telemetry-forwarder:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: FauzanEngine/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27.0" "pydantic>=2.7.0" "fastapi>=0.111.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
      - name: Run telemetry forwarder tests
        run: python -m pytest tests/test_telemetry_forwarder.py -q
