name: R1 Canonical Game Tool

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Farm/farm_canonical_game_tool_smoke.cpp'
      - '.github/workflows/r1-canonical-game-tool.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/**'
      - 'Tests/Farm/farm_canonical_game_tool_smoke.cpp'
      - '.github/workflows/r1-canonical-game-tool.yml'
  workflow_dispatch:

jobs:
  canonical-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libsdl2-dev glslang-tools ninja-build

      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r1-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Release smoke
        run: |
          cmake --build build/r1-release --target farm_canonical_game_tool_smoke -j2
          ./build/r1-release/farm_canonical_game_tool_smoke

      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r1-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'

      - name: Build and run ASAN smoke
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          cmake --build build/r1-asan --target farm_canonical_game_tool_smoke -j2
          ./build/r1-asan/farm_canonical_game_tool_smoke
