name: SDL3 migration once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[SDL3-MIGRATION-AUTO]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev

      - name: Build and install SDL 3.4.14
        run: |
          curl -L --fail https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz -o /tmp/SDL3.tar.gz
          echo '30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb  /tmp/SDL3.tar.gz' | sha256sum -c -
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.14 -B /tmp/sdl3-build -G Ninja -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/sdl3-build -j2
          sudo cmake --install /tmp/sdl3-build --prefix /usr/local

      - name: Migrate remaining SDL2/Vulkan API surface
        shell: bash
        run: |
          set -euo pipefail
          cmake_file=Source/NeoEngine/CMakeLists.txt
          sed -i 's/find_package(SDL2 REQUIRED)/find_package(SDL3 3.4.14 CONFIG REQUIRED COMPONENTS SDL3)/' "$cmake_file"
          sed -i 's/SDL2::SDL2/SDL3::SDL3/g' "$cmake_file"

          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('Source/NeoEngine/Rendering/RHI/Vulkan/VulkanRHI.cpp'),
              Path('Source/NeoEngine/Runtime/VulkanPresentProbe.cpp'),
              Path('Source/NeoEngine/Runtime/VulkanTexturedPresent.cpp'),
              Path('Tests/Rendering/vulkan_rhi_smoke.cpp'),
          ]
          for p in files:
              s = p.read_text()
              s = s.replace('#include <SDL.h>', '#include <SDL3/SDL.h>')
              s = s.replace('#include <SDL_vulkan.h>', '#include <SDL3/SDL_vulkan.h>')
              s = s.replace('SDL_Vulkan_GetInstanceExtensions(window, &extensionCount, nullptr) != SDL_TRUE || extensionCount == 0', 'SDL_Vulkan_GetInstanceExtensions(&extensionCount) == nullptr || extensionCount == 0')
              s = s.replace('SDL_Vulkan_GetInstanceExtensions(resources.window, &extensionCount, nullptr) != SDL_TRUE || extensionCount == 0', 'SDL_Vulkan_GetInstanceExtensions(&extensionCount) == nullptr || extensionCount == 0')
              s = s.replace('SDL_Vulkan_GetInstanceExtensions(window, &extensionCount, extensions.data()) != SDL_TRUE', 'SDL_Vulkan_GetInstanceExtensions(&extensionCount) == nullptr')
              s = s.replace('SDL_Vulkan_GetInstanceExtensions(resources.window, &extensionCount, extensions.data()) != SDL_TRUE', 'SDL_Vulkan_GetInstanceExtensions(&extensionCount) == nullptr')
              s = s.replace('SDL_Vulkan_CreateSurface(window, m_Instance, &m_Surface) != SDL_TRUE', '!SDL_Vulkan_CreateSurface(window, m_Instance, nullptr, &m_Surface)')
              s = s.replace('SDL_Vulkan_CreateSurface(resources.window, resources.instance, &resources.surface) != SDL_TRUE', '!SDL_Vulkan_CreateSurface(resources.window, resources.instance, nullptr, &resources.surface)')
              s = s.replace('SDL_Vulkan_CreateSurface(window, resources.instance, &resources.surface) != SDL_TRUE', '!SDL_Vulkan_CreateSurface(window, resources.instance, nullptr, &resources.surface)')
              s = s.replace('SDL_Init(SDL_INIT_VIDEO) != 0', '!SDL_Init(SDL_INIT_VIDEO)')
              s = s.replace('SDL_InitSubSystem(SDL_INIT_VIDEO) != 0', '!SDL_InitSubSystem(SDL_INIT_VIDEO)')
              s = s.replace('SDL_QuitSubSystem(SDL_INIT_VIDEO);', 'SDL_QuitSubSystem(SDL_INIT_VIDEO);')
              s = s.replace('SDL_WINDOWPOS_UNDEFINED, SDL_WINDOWPOS_UNDEFINED, static_cast<int>(width), static_cast<int>(height), SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN', 'static_cast<int>(width), static_cast<int>(height), SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN')
              s = s.replace('SDL_WINDOWPOS_UNDEFINED, SDL_WINDOWPOS_UNDEFINED,\n                                        static_cast<int>(width), static_cast<int>(height), SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN', 'static_cast<int>(width), static_cast<int>(height), SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN')
              s = s.replace('SDL_WINDOWPOS_UNDEFINED, SDL_WINDOWPOS_UNDEFINED,\n                                          64, 64, SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN', '64, 64, SDL_WINDOW_VULKAN | SDL_WINDOW_HIDDEN')
              s = s.replace('SDL_INIT_VIDEO | SDL_INIT_GAMECONTROLLER', 'SDL_INIT_VIDEO | SDL_INIT_GAMEPAD')
              s = s.replace('SDL_WINDOWEVENT_CLOSE', 'SDL_EVENT_WINDOW_CLOSE_REQUESTED')
              p.write_text(s)
          PY

      - name: Audit remaining SDL2 API references
        run: |
          if grep -RInE 'SDL2::SDL2|find_package\(SDL2|#include <SDL\.h>|#include <SDL_vulkan\.h>|SDL_INIT_GAMECONTROLLER|SDL_CONTROLLER' Source Tests; then
            echo 'Legacy SDL2 references remain.'
            exit 1
          fi

      - name: Configure and build NeoEngine core
        run: |
          cmake -S Source/NeoEngine -B build-sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sdl3 --target neo_core -j2

      - name: Commit only after successful validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/NeoEngine/CMakeLists.txt Source/NeoEngine/Rendering/RHI/Vulkan/VulkanRHI.cpp Source/NeoEngine/Runtime/VulkanPresentProbe.cpp Source/NeoEngine/Runtime/VulkanTexturedPresent.cpp Tests/Rendering/vulkan_rhi_smoke.cpp
          if git diff --cached --quiet; then
            echo 'No SDL3 migration changes to commit.'
            exit 0
          fi
          git commit -m '[SDL3-MIGRATION-AUTO] Complete SDL3 CMake and Vulkan migration'
          git push
