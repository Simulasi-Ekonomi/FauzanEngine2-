name: R2 canonical Farm loop

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/Runtime/NeoRuntime.*'
      - 'Source/NeoEngine/Runtime/FarmRuntimeHud.*'
      - 'Source/NeoEngine/Runtime/FarmRuntimeSession.*'
      - 'Source/NeoEngine/Systems/FarmSystem.*'
      - 'Source/NeoEngine/Systems/FarmProgressCheckpointFile.*'
      - 'Source/NeoEngine/Systems/CurriculumSystem.*'
      - 'Source/NeoEngine/Systems/AgricultureCurriculum.*'
      - 'Tests/Runtime/neo_runtime_farm_vertical_slice_smoke.cpp'
      - 'Tests/Runtime/neo_runtime_farm_progress_file_smoke.cpp'
      - 'Tests/Farm/farm_balance_profile_smoke.cpp'
      - '.github/workflows/r2-farm-loop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/NeoEngine/Runtime/NeoRuntime.*'
      - 'Source/NeoEngine/Runtime/FarmRuntimeHud.*'
      - 'Source/NeoEngine/Runtime/FarmRuntimeSession.*'
      - 'Source/NeoEngine/Systems/FarmSystem.*'
      - 'Source/NeoEngine/Systems/FarmProgressCheckpointFile.*'
      - 'Source/NeoEngine/Systems/CurriculumSystem.*'
      - 'Source/NeoEngine/Systems/AgricultureCurriculum.*'
      - 'Tests/Runtime/neo_runtime_farm_vertical_slice_smoke.cpp'
      - 'Tests/Runtime/neo_runtime_farm_progress_file_smoke.cpp'
      - 'Tests/Farm/farm_balance_profile_smoke.cpp'
      - '.github/workflows/r2-farm-loop.yml'
  workflow_dispatch:

jobs:
  farm-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libsdl2-dev glslang-tools ninja-build
      - name: Build and install SDL3
        run: |
          set -euo pipefail
          SDL_VERSION=3.4.14
          SDL_SHA256=30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" \
            -o /tmp/SDL3.tar.gz
          echo "${SDL_SHA256}  /tmp/SDL3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          SDL_SOURCE_DIR="$(tar -tzf /tmp/SDL3.tar.gz | awk -F/ 'NF > 1 {print $1; exit}')"
          test -n "${SDL_SOURCE_DIR}"
          test -f "/tmp/${SDL_SOURCE_DIR}/CMakeLists.txt"
          cmake -S "/tmp/${SDL_SOURCE_DIR}" -B /tmp/SDL-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL-build --parallel
          sudo cmake --install /tmp/SDL-build
          sudo ldconfig
          pkg-config --modversion sdl3
      - name: Configure Release
        run: cmake -S Source/NeoEngine -B build/r2-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build and run Release R2 smokes
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cmake --build build/r2-release --target neo_runtime_farm_vertical_slice_smoke neo_runtime_farm_progress_file_smoke farm_balance_profile_smoke -j2
          ./build/r2-release/neo_runtime_farm_vertical_slice_smoke
          ./build/r2-release/neo_runtime_farm_progress_file_smoke
          ./build/r2-release/farm_balance_profile_smoke
      - name: Configure AddressSanitizer
        run: |
          cmake -S Source/NeoEngine -B build/r2-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address'
      - name: Build and run ASAN R2 smokes
        env:
          ASAN_OPTIONS: detect_leaks=1
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cmake --build build/r2-asan --target neo_runtime_farm_vertical_slice_smoke neo_runtime_farm_progress_file_smoke farm_balance_profile_smoke -j2
          ./build/r2-asan/neo_runtime_farm_vertical_slice_smoke
          ./build/r2-asan/neo_runtime_farm_progress_file_smoke
          ./build/r2-asan/farm_balance_profile_smoke
