name: PBR-1 Validation

on:
  push:
    branches: [ feature/pbr-materials-r2 ]
  pull_request:
    branches: [ main ]

jobs:
  pbr1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev libglm-dev libjsoncpp-dev glslang-tools

      - name: Build PBR-1 smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/VulkanGPUBuffer.cpp \
            Source/NeoEngine/Runtime/VulkanGPUTexture.cpp \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/PBRMaterial.cpp \
            Source/NeoEngine/Runtime/BRDFLut.cpp \
            Tests/pbr_material_smoke.cpp \
            -ljsoncpp -lvulkan -o /tmp/pbr_material_smoke

      - name: Validate PBR shader
        run: glslangValidator -V Source/NeoEngine/Shaders/pbr_material.frag -o /tmp/pbr_material.frag.spv

      - name: Run PBR smoke
        run: /tmp/pbr_material_smoke
