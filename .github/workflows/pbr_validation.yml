name: PBR Validation

on:
  push:
    branches: [ feature/pbr-environment-r1 ]
  pull_request:
    branches: [ main ]

jobs:
  pbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev libglm-dev libjsoncpp-dev glslang-tools pkg-config mesa-vulkan-drivers

      - name: Verify Vulkan software device
        run: |
          vulkaninfo --summary || true

      - name: Build PBR-1 material smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine $(pkg-config --cflags jsoncpp) \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/VulkanGPUBuffer.cpp \
            Source/NeoEngine/Runtime/VulkanGPUTexture.cpp \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/PBRMaterial.cpp \
            Source/NeoEngine/Runtime/BRDFLut.cpp \
            Tests/pbr_material_smoke.cpp \
            $(pkg-config --libs jsoncpp) -lvulkan -o /tmp/pbr_material_smoke

      - name: Build PBR-2 lighting smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/PBRLighting.cpp \
            Tests/pbr_lighting_smoke.cpp \
            -o /tmp/pbr_lighting_smoke

      - name: Build PBR-3 IBL smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Tests/pbr_ibl_smoke.cpp \
            -o /tmp/pbr_ibl_smoke

      - name: Build PBR-4 render pipeline smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/VulkanGraphicsPipeline.cpp \
            Source/NeoEngine/Runtime/PBRRenderPipeline.cpp \
            Tests/pbr_render_pipeline_smoke.cpp \
            -lvulkan -o /tmp/pbr_render_pipeline_smoke

      - name: Build PBR-5 environment smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Source/NeoEngine/Runtime/PBREnvironment.cpp \
            Tests/pbr_environment_smoke.cpp \
            -lvulkan -o /tmp/pbr_environment_smoke

      - name: Validate PBR shaders
        run: |
          glslangValidator -V Source/NeoEngine/Shaders/neo_mesh.vert -o /tmp/neo_mesh.vert.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_material.frag -o /tmp/pbr_material.frag.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_lighting.frag -o /tmp/pbr_lighting.frag.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_ibl.frag -o /tmp/pbr_ibl.frag.spv

      - name: Run PBR-1 smoke
        run: /tmp/pbr_material_smoke

      - name: Run PBR-2 smoke
        run: /tmp/pbr_lighting_smoke

      - name: Run PBR-3 smoke
        run: /tmp/pbr_ibl_smoke

      - name: Run PBR-4 smoke
        run: /tmp/pbr_render_pipeline_smoke

      - name: Run PBR-5 smoke
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: /tmp/pbr_environment_smoke
