name: PBR Validation

on:
  push:
    branches: [ feature/pbr-environment-r1, feature/pbr-6-2-shader-library-r1, pbr-6.3-integration, pbr-postmerge-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  pbr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev libglm-dev libjsoncpp-dev glslang-tools spirv-tools pkg-config mesa-vulkan-drivers vulkan-tools

      - name: Verify Vulkan software device
        run: |
          echo "Vulkan ICD files:"
          find /usr/share/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d -maxdepth 1 -type f -name '*.json' -print 2>/dev/null || true
          echo "Vulkan summary:"
          vulkaninfo --summary

      - name: Select software Vulkan ICD
        run: |
          ICD="$(find /usr/share/vulkan/icd.d /usr/lib/x86_64-linux-gnu/vulkan/icd.d \
            -maxdepth 1 -type f \( -name 'lvp_icd.json' -o -name 'lvp_icd.x86_64.json' \) \
            -print -quit 2>/dev/null || true)"
          test -n "$ICD"
          echo "Using Vulkan ICD: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"

      - name: Build PBR-1 material smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine $(pkg-config --cflags jsoncpp) \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/VulkanGPUBuffer.cpp \
            Source/NeoEngine/Runtime/VulkanGPUTexture.cpp \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/PBRMaterial.cpp \
            Source/NeoEngine/Runtime/BRDFLut.cpp \
            Tests/pbr_material_smoke.cpp \
            $(pkg-config --libs jsoncpp) -lvulkan -o /tmp/pbr_material_smoke

      - name: Build PBR-2 lighting smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/PBRLighting.cpp \
            Tests/pbr_lighting_smoke.cpp \
            -o /tmp/pbr_lighting_smoke

      - name: Build PBR-3 IBL smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Tests/pbr_ibl_smoke.cpp \
            -o /tmp/pbr_ibl_smoke

      - name: Build PBR-4 render pipeline smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/VulkanGraphicsPipeline.cpp \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Source/NeoEngine/Runtime/PBRRenderPipeline.cpp \
            Tests/pbr_render_pipeline_smoke.cpp \
            -lvulkan -o /tmp/pbr_render_pipeline_smoke

      - name: Build PBR-5 environment smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/VulkanGPUTexture.cpp \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Source/NeoEngine/Runtime/BRDFLut.cpp \
            Source/NeoEngine/Runtime/PBREnvironment.cpp \
            Source/NeoEngine/Runtime/PBREnvironmentDescriptorSet.cpp \
            Tests/pbr_environment_smoke.cpp \
            -lvulkan -o /tmp/pbr_environment_smoke

      - name: Build PBR-5 environment descriptor smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/VulkanDescriptorManager.cpp \
            Source/NeoEngine/Runtime/PBREnvironment.cpp \
            Source/NeoEngine/Runtime/PBREnvironmentDescriptorSet.cpp \
            Source/NeoEngine/Runtime/PBRIBL.cpp \
            Tests/pbr_environment_descriptor_smoke.cpp \
            -lvulkan -o /tmp/pbr_environment_descriptor_smoke

      - name: Build PBR-6.2 shader library smoke target
        run: |
          g++ -std=c++20 -O2 -I Source/NeoEngine \
            Source/NeoEngine/Runtime/VulkanContext.cpp \
            Source/NeoEngine/Runtime/ShaderLibrary.cpp \
            Tests/shader_library_smoke.cpp \
            $(pkg-config --cflags --libs vulkan) -o /tmp/shader_library_smoke

      - name: Validate PBR shaders
        run: |
          glslangValidator -V Source/NeoEngine/Shaders/neo_mesh.vert -o /tmp/neo_mesh.vert.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_material.frag -o /tmp/pbr_material.frag.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_lighting.frag -o /tmp/pbr_lighting.frag.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_ibl.frag -o /tmp/pbr_ibl.frag.spv
          glslangValidator -V Source/NeoEngine/Shaders/pbr_lighting_ibl.frag -o /tmp/pbr_lighting_ibl.frag.spv

      - name: Validate generated SPIR-V
        run: |
          spirv-val /tmp/neo_mesh.vert.spv
          spirv-val /tmp/pbr_material.frag.spv
          spirv-val /tmp/pbr_lighting.frag.spv
          spirv-val /tmp/pbr_ibl.frag.spv
          spirv-val /tmp/pbr_lighting_ibl.frag.spv

      - name: Run PBR-1 smoke
        run: /tmp/pbr_material_smoke

      - name: Run PBR-2 smoke
        run: /tmp/pbr_lighting_smoke

      - name: Run PBR-3 smoke
        run: /tmp/pbr_ibl_smoke

      - name: Run PBR-4 smoke
        run: /tmp/pbr_render_pipeline_smoke

      - name: Run PBR-5 smoke
        run: /tmp/pbr_environment_smoke

      - name: Run PBR-5 environment descriptor smoke
        run: /tmp/pbr_environment_descriptor_smoke

      - name: Run PBR-6.2 shader library smoke
        run: /tmp/shader_library_smoke /tmp/neo_mesh.vert.spv /tmp/pbr_lighting.frag.spv
