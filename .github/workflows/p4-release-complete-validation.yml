name: P4 release complete validation

on:
  push:
    branches:
      - p4-release-certification-night
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        run: |
          cd editor
          npm ci
          npm run build
          mkdir -p ../android/app/src/main/assets/editor
          cp -r dist/* ../android/app/src/main/assets/editor/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install native engine validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev mesa-vulkan-drivers libjsoncpp-dev libglm-dev glslang-tools pkg-config xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxinerama-dev libwayland-dev libasound2-dev

      - name: Install SDL3 for canonical engine validation
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure and run canonical engine Release integration smoke
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
        run: |
          cmake -S Source/NeoEngine -B build/p4-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/p4-release --target comprehensive_engine_verification_smoke -j2
          xvfb-run -a ./build/p4-release/comprehensive_engine_verification_smoke

      - name: Configure and run canonical engine ASAN+UBSAN integration smoke
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S Source/NeoEngine -B build/p4-asan -G Ninja             -DCMAKE_BUILD_TYPE=RelWithDebInfo             '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'             '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build/p4-asan --target comprehensive_engine_verification_smoke -j2
          xvfb-run -a ./build/p4-asan/comprehensive_engine_verification_smoke

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Generate release manifest
        run: bash tools/release_manifest.sh p4-release-manifest.sha256

      - name: Generate source SBOM
        run: python3 tools/generate_source_sbom.py

      - name: Validate canonical release scope
        run: bash tools/verify_canonical_runtime_scope.sh

      - name: Syntax-check certification tools
        run: |
          python3 -m py_compile tools/p4_release_gate.py tools/p4_release_artifact_gate.py tools/p4_reproducibility_gate.py tools/generate_source_sbom.py tools/verify_release_provenance.py
          bash -n tools/p4_release_certify.sh tools/p4_build_release_artifact.sh tools/release_manifest.sh

      - name: Run P4 release gate
        run: python3 tools/p4_release_gate.py

      - name: Validate manifest reproducibility
        run: |
          bash tools/release_manifest.sh /tmp/p4-release-manifest.second.sha256
          cmp -s p4-release-manifest.sha256 /tmp/p4-release-manifest.second.sha256

      - name: Materialize release signing keystore
        env:
          NEO_ANDROID_KEYSTORE_B64: ${{ secrets.NEO_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$NEO_ANDROID_KEYSTORE_B64"
          printf '%s' "$NEO_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/neoengine-release.keystore"
          test -s "$RUNNER_TEMP/neoengine-release.keystore"

      - name: Require release signing material
        env:
          NEO_ANDROID_KEYSTORE: ${{ runner.temp }}/neoengine-release.keystore
          NEO_ANDROID_KEY_ALIAS: ${{ secrets.NEO_ANDROID_KEY_ALIAS }}
          NEO_ANDROID_STORE_PASSWORD: ${{ secrets.NEO_ANDROID_STORE_PASSWORD }}
          NEO_ANDROID_KEY_PASSWORD: ${{ secrets.NEO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$NEO_ANDROID_KEYSTORE"
          test -s "$NEO_ANDROID_KEYSTORE"
          test -n "$NEO_ANDROID_KEY_ALIAS"
          test -n "$NEO_ANDROID_STORE_PASSWORD"
          test -n "$NEO_ANDROID_KEY_PASSWORD"

      - name: Build signed release APK
        env:
          NEO_ANDROID_KEYSTORE: ${{ runner.temp }}/neoengine-release.keystore
          NEO_ANDROID_KEY_ALIAS: ${{ secrets.NEO_ANDROID_KEY_ALIAS }}
          NEO_ANDROID_STORE_PASSWORD: ${{ secrets.NEO_ANDROID_STORE_PASSWORD }}
          NEO_ANDROID_KEY_PASSWORD: ${{ secrets.NEO_ANDROID_KEY_PASSWORD }}
        run: |
          tools/p4_build_release_artifact.sh assembleRelease

      - name: Build signed release AAB
        env:
          NEO_ANDROID_KEYSTORE: ${{ runner.temp }}/neoengine-release.keystore
          NEO_ANDROID_KEY_ALIAS: ${{ secrets.NEO_ANDROID_KEY_ALIAS }}
          NEO_ANDROID_STORE_PASSWORD: ${{ secrets.NEO_ANDROID_STORE_PASSWORD }}
          NEO_ANDROID_KEY_PASSWORD: ${{ secrets.NEO_ANDROID_KEY_PASSWORD }}
        run: |
          tools/p4_build_release_artifact.sh bundleRelease

      - name: Verify release artifact structure and signatures
        run: |
          python3 tools/p4_release_artifact_gate.py android/app/build/outputs/apk/release/app-release.apk
          python3 tools/p4_release_artifact_gate.py android/app/build/outputs/bundle/release/app-release.aab

      - name: Build a second signed APK for reproducibility evidence
        env:
          NEO_ANDROID_KEYSTORE: ${{ runner.temp }}/neoengine-release.keystore
          NEO_ANDROID_KEY_ALIAS: ${{ secrets.NEO_ANDROID_KEY_ALIAS }}
          NEO_ANDROID_STORE_PASSWORD: ${{ secrets.NEO_ANDROID_STORE_PASSWORD }}
          NEO_ANDROID_KEY_PASSWORD: ${{ secrets.NEO_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/repro-apk"
          tools/p4_build_release_artifact.sh assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/repro-apk/app-release.apk"

      - name: Verify reproducible release APK
        run: |
          python3 tools/p4_reproducibility_gate.py             android/app/build/outputs/apk/release/app-release.apk             "$RUNNER_TEMP/repro-apk/app-release.apk"

      - name: Build a second signed AAB for reproducibility evidence
        env:
          NEO_ANDROID_KEYSTORE: ${{ runner.temp }}/neoengine-release.keystore
          NEO_ANDROID_KEY_ALIAS: ${{ secrets.NEO_ANDROID_KEY_ALIAS }}
          NEO_ANDROID_STORE_PASSWORD: ${{ secrets.NEO_ANDROID_STORE_PASSWORD }}
          NEO_ANDROID_KEY_PASSWORD: ${{ secrets.NEO_ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/repro-aab"
          tools/p4_build_release_artifact.sh bundleRelease
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/repro-aab/app-release.aab"

      - name: Verify reproducible release AAB
        run: |
          python3 tools/p4_reproducibility_gate.py             android/app/build/outputs/bundle/release/app-release.aab             "$RUNNER_TEMP/repro-aab/app-release.aab"

      - name: Run end-to-end P4 release certification and provenance
        run: |
          mkdir -p "$RUNNER_TEMP/p4-reference"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/p4-reference/app-release.apk"
          tools/p4_release_certify.sh \\
            android/app/build/outputs/apk/release/app-release.apk \\
            "$RUNNER_TEMP/repro-apk/app-release.apk"
          python3 tools/verify_release_provenance.py android/app/build/outputs/apk/release/app-release.apk
          test -s p4-release-provenance.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-release-complete-validation
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            p4-release-manifest.sha256
            p4-source-sbom.json
            p4-release-provenance.txt
          if-no-files-found: warn
